# ============================================================
#  Airport Operations Management System - Application Config
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/airport_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Siya@1003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize schema
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# JWT
jwt.secret=airport_super_secret_key_2024_minimum_256_bits_long
jwt.expiration=86400000

# WebSocket
websocket.endpoint=/ws
websocket.topic.flight-status=/topic/flight-status

# Logging
logging.level.com.airport=DEBUG
logging.level.org.springframework.security=INFO

# CORS
cors.allowed-origins=http://localhost:3000
